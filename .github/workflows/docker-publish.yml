name: Publish Docker Image

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-pull the base image with retries. Docker Hub occasionally times out
      # resolving the manifest; the default buildx (docker driver) then reuses
      # this locally-pulled image instead of re-resolving during the build.
      - name: Pull base image (retry transient registry errors)
        run: |
          for attempt in 1 2 3; do
            if docker pull rust:alpine; then exit 0; fi
            echo "::warning::base image pull failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          echo "::error::failed to pull base image after 3 attempts"
          exit 1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
