<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkURL - URL Shortener</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        
        <div class="form-group">
            <label for="url">Long URL</label>
            <input type="url" id="url" placeholder="https://example.com/very-long-path" required>
        </div>
        
        <div class="form-group">
            <label for="custom_code">Custom Code (Optional)</label>
            <input type="text" id="custom_code" placeholder="my-cool-link">
        </div>
        
        <button id="shorten-btn">Shorten URL</button>
        
        <div id="error" class="error"></div>
        
        <div id="result">
            <div class="result-header">Your short link is ready</div>
            <a id="short-link" href="" target="_blank"></a>
            <button id="copy-btn">Copy to Clipboard</button>
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
