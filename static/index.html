<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EkURL - URL Shortener</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <form id="shorten-form" class="view" novalidate>
            <div class="form-group">
                <label for="url">Long URL</label>
                <input type="url" id="url" placeholder="https://example.com/very-long-path" required autofocus>
            </div>

            <div class="form-group">
                <label for="expires_in">Expires In</label>
                <select id="expires_in">
                    <option value="1d">1 day</option>
                    <option value="7d" selected>7 days</option>
                    <option value="1mo">1 month</option>
                    <option value="3mo">3 months</option>
                    <option value="6mo">6 months</option>
                    <option value="1y">1 year</option>
                    <option value="never">Never</option>
                </select>
            </div>

            <div class="form-group">
                <label for="custom_code">Custom Code (Optional)</label>
                <input type="text" id="custom_code" placeholder="my-cool-link">
            </div>

            <button id="shorten-btn" type="submit">Shorten URL</button>

            <div id="error" class="error" role="alert" aria-live="polite"></div>
        </form>

        <section id="result" class="view" hidden>
            <div class="result-header">Your short link is ready</div>
            <a id="short-link" href="" target="_blank" rel="noopener"></a>
            <div id="expiry-info" class="expiry-info"></div>
            <canvas id="qr-canvas" width="180" height="180" aria-label="QR code for the short link"></canvas>
            <div class="action-row">
                <button id="copy-btn" type="button" class="secondary">Copy</button>
                <button id="open-btn" type="button" class="secondary">Open</button>
                <button id="share-btn" type="button" class="secondary" hidden>Share</button>
            </div>
            <button id="reset-btn" type="button" class="link-btn">Shorten another</button>
        </section>
    </div>

    <script src="./js/qrcode.js" defer></script>
    <script src="./js/app.js" defer></script>
</body>
</html>
